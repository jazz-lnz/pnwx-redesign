<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Types | PNWX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light parts-page">
  <div id="navbar-container"></div>

  <div style="background:#fff;border-bottom:1px solid #e4e7ec;">
    <div id="types-breadcrumb" style="max-width:1280px;margin:0 auto;padding:0.55rem 1rem;">
      <ol class="breadcrumb mb-0" style="font-size:0.78rem;">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Home</a></li>
        <li class="breadcrumb-item active" id="types-breadcrumb-title">Products</li>
      </ol>
    </div>
  </div>

  <div class="container mt-4">
    <p class="text-uppercase text-muted mb-1 small tracking-widest">Browse Category</p>
    <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
      <h2 class="parts-main-title mb-0" id="types-title">Product Types</h2>
      <span class="text-muted small" id="types-count">0 product type(s)</span>
    </div>
  </div>

  <main class="container parts-grid mb-5" style="min-height: 68vh;">
    <div class="row g-4" id="types-container"></div>
    <div class="text-center text-muted mt-5 mb-4 italic small">--- Nothing follows ---</div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/load-components.js"></script>
  <script>
    function renderTypes() {
      const hash = window.location.hash.slice(1) || 'parts';
      const db = window.PRODUCTS_DB || {};
      const category = db[hash];
      const container = document.getElementById('types-container');
      const titleEl = document.getElementById('types-title');
      const bcTitle = document.getElementById('types-breadcrumb-title');
      const countEl = document.getElementById('types-count');

      if (!category) {
        titleEl.textContent = 'Products';
        bcTitle.textContent = 'Products';
        countEl.textContent = '0 product type(s)';
        container.innerHTML = '<div class="text-muted py-4">No product types found for this category.</div>';
        return;
      }

      const types = category.productTypes || [];
      titleEl.textContent = category.categoryTitle || 'Products';
      bcTitle.textContent = category.categoryTitle || 'Products';
      countEl.textContent = `${types.length} product type(s)`;

      const html = types.map(type => `
        <div class="col-md-3">
          <div class="card part-card h-100 position-relative">
            <img src="${type.typeImage}" class="card-img-top" alt="${type.typeTitle}">
            <div class="card-body">
              <h5 class="part-title">${type.typeTitle}</h5>
              <p class="part-desc">${type.typeDescription}</p>
            </div>
            <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center pb-3">
              <span class="badge rounded-pill bg-light text-dark border px-3 py-2">${type.typeTag}</span>
              <i class="bi bi-arrow-right text-navy"></i>
            </div>
          </div>
        </div>
      `).join('');

      container.innerHTML = html;
    }

    window.addEventListener('hashchange', renderTypes);
    document.addEventListener('DOMContentLoaded', renderTypes);
  </script>
</body>
</html>
